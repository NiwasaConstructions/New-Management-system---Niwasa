<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Niwasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ExcelJS & FileSaver for Super Styling Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 500px; }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div><h1 class="text-2xl font-bold"><i class="fa-solid fa-building-shield"></i> Niwasa Admin</h1></div>
        <div class="space-x-4">
            <button id="navReports" class="nav-btn text-blue-300 font-semibold">Reports</button>
            <button id="navSites" class="nav-btn hover:text-blue-300 font-semibold">Manage Sites</button>
            <button id="navUsers" class="nav-btn hover:text-blue-300 font-semibold">Manage Users</button>
            <button id="btnLogout" class="bg-red-600 px-4 py-1 rounded hover:bg-red-700 font-bold ml-4">Logout</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
        <!-- REPORTS TAB -->
        <div id="reportsTab" class="tab-content block">
            <h2 class="text-2xl font-bold mb-4">Submitted Reports</h2>
            <div class="bg-white p-6 rounded shadow overflow-x-auto">
                <table class="w-full text-left border">
                    <thead class="bg-gray-200"><tr><th class="p-3 border">Date</th><th class="p-3 border">Site</th><th class="p-3 border">Weather</th><th class="p-3 border">Prepared By</th><th class="p-3 border">Action</th></tr></thead>
                    <tbody id="reportsTable"></tbody>
                </table>
            </div>
        </div>

        <!-- SITES TAB (Same as before) -->
        <div id="sitesTab" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Manage Sites</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow">
                    <form id="addSiteForm" class="space-y-4">
                        <input type="text" id="siteName" placeholder="Site Name" class="w-full border p-2 rounded" required>
                        <input type="text" id="siteLocation" placeholder="Location" class="w-full border p-2 rounded" required>
                        <select id="siteStatus" class="w-full border p-2 rounded"><option>Ongoing</option><option>Completed</option></select>
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded">Add Site</button>
                    </form>
                </div>
                <div class="md:col-span-2 bg-white p-6 rounded shadow">
                    <table class="w-full border text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2 border">Site</th><th class="p-2 border">Status</th><th class="p-2 border">Action</th></tr></thead><tbody id="sitesTable"></tbody></table>
                </div>
            </div>
        </div>

        <!-- USERS TAB (Same as before) -->
        <div id="usersTab" class="tab-content hidden">
            <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold text-gray-800">User Access Management</h2></div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow h-fit">
                    <form id="addUserForm" class="space-y-4">
                        <input type="email" id="uEmail" placeholder="User Email" class="w-full border p-2 rounded" required>
                        <input type="password" id="uPass" placeholder="Password" class="w-full border p-2 rounded" required>
                        <select id="uRole" class="w-full border p-2 rounded" required><option value="">Select Role...</option><option value="supervisor">Supervisor</option><option value="customer">Customer</option></select>
                        <div><label class="block text-sm font-bold text-gray-700 mb-2">Assign Sites</label><div id="siteCheckboxes" class="border p-3 rounded bg-gray-50 max-h-40 overflow-y-auto space-y-2"></div></div>
                        <button type="submit" id="createUserBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Create & Grant Access</button>
                        <p id="userStatus" class="text-sm font-bold text-center mt-2"></p>
                    </form>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded shadow">
                    <div class="overflow-x-auto"><table class="w-full border text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2 border">Email</th><th class="p-2 border">Role</th><th class="p-2 border">Sites</th><th class="p-2 border text-center">Actions</th></tr></thead><tbody id="usersTable"></tbody></table></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="editUserModal" class="modal"><div class="modal-content"><div class="flex justify-between items-center border-b pb-2 mb-4"><h3 class="font-bold text-xl">Edit Assigned Sites</h3><span class="cursor-pointer text-2xl font-bold text-red-500 hover:text-red-700" onclick="closeEditModal()">&times;</span></div><input type="hidden" id="editUserId"><div id="editSiteCheckboxes" class="border p-3 rounded bg-gray-50 max-h-60 overflow-y-auto space-y-2 mb-4"></div><button onclick="saveUserSites()" id="saveSitesBtn" class="w-full bg-green-600 text-white font-bold py-2 rounded">Save Changes</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const config = { apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM", authDomain: "niwasa-new-labour.firebaseapp.com", projectId: "niwasa-new-labour", storageBucket: "niwasa-new-labour.firebasestorage.app", messagingSenderId: "963050302203", appId: "1:963050302203:web:b48870480bd31079f35e5e" };
        const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);
        const appSecondary = initializeApp(config, "Secondary"); const authSecondary = getAuth(appSecondary);

        // Core UI Logistics
        const switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden')); document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-blue-300'));
            document.getElementById(tabId + 'Tab').classList.remove('hidden'); document.getElementById('nav' + tabId.charAt(0).toUpperCase() + tabId.slice(1)).classList.add('text-blue-300');
            if(tabId === 'users') loadUsers();
        };
        document.getElementById('navReports').addEventListener('click', () => switchTab('reports')); document.getElementById('navSites').addEventListener('click', () => switchTab('sites')); document.getElementById('navUsers').addEventListener('click', () => switchTab('users'));
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth).then(() => window.location.href = "index.html"));
        
        let globalSites = [];
        async function loadSites() {
            const snap = await getDocs(collection(db, "sites")); globalSites = [];
            const tbody = document.getElementById('sitesTable'), cbDiv = document.getElementById('siteCheckboxes'); tbody.innerHTML = ''; cbDiv.innerHTML = '';
            snap.forEach(d => {
                const s = d.data(); globalSites.push({ id: d.id, name: s.name, status: s.status });
                tbody.innerHTML += `<tr><td class="p-2 border font-bold">${s.name}</td><td class="p-2 border">${s.status}</td><td class="p-2 border"><button data-id="${d.id}" data-status="${s.status}" class="toggle-status-btn bg-gray-800 text-white text-xs px-2 py-1 rounded">Toggle</button></td></tr>`;
                if(s.status === 'Ongoing') cbDiv.innerHTML += `<label class="flex items-center space-x-2 p-1 hover:bg-gray-200 cursor-pointer"><input type="checkbox" value="${s.name}" class="site-cb w-4 h-4 text-blue-600"><span class="font-semibold">${s.name}</span></label>`;
            });
        }
        document.getElementById('addSiteForm').addEventListener('submit', async(e) => { e.preventDefault(); await addDoc(collection(db, "sites"), { name: document.getElementById('siteName').value, location: document.getElementById('siteLocation').value, status: document.getElementById('siteStatus').value, createdAt: new Date() }); e.target.reset(); loadSites(); alert("Site Added!"); });
        document.getElementById('sitesTable').addEventListener('click', async (e) => { if(e.target.classList.contains('toggle-status-btn')) { await updateDoc(doc(db, "sites", e.target.getAttribute('data-id')), { status: e.target.getAttribute('data-status') === 'Ongoing' ? 'Completed' : 'Ongoing' }); loadSites(); loadUsers(); } });

        async function loadUsers() {
            const snap = await getDocs(collection(db, "users")); const tbody = document.getElementById('usersTable'); tbody.innerHTML = '';
            snap.forEach(d => {
                const u = d.data(), uid = d.id; const sitesList = (u.assignedSites && u.assignedSites.length > 0) ? u.assignedSites.join(', ') : '-';
                const actions = u.role === 'admin' ? '-' : `<button onclick="openEditModal('${uid}', '${u.assignedSites ? u.assignedSites.join(',') : ''}')" class="bg-yellow-500 text-white text-xs px-2 py-1 rounded mr-1">Edit</button><button onclick="deleteUserRecord('${uid}', '${u.email}')" class="bg-red-500 text-white text-xs px-2 py-1 rounded">Revoke</button>`;
                tbody.innerHTML += `<tr class="border-b hover:bg-gray-50"><td class="p-2 border">${u.email}</td><td class="p-2 border">${u.role}</td><td class="p-2 border">${sitesList}</td><td class="p-2 border text-center">${actions}</td></tr>`;
            });
        }
        document.getElementById('addUserForm').addEventListener('submit', async(e) => {
            e.preventDefault(); const selectedSites = Array.from(document.querySelectorAll('.site-cb:checked')).map(cb => cb.value);
            const btn = document.getElementById('createUserBtn'); btn.innerText = "Creating...";
            try {
                const cred = await createUserWithEmailAndPassword(authSecondary, document.getElementById('uEmail').value, document.getElementById('uPass').value);
                await setDoc(doc(db, "users", cred.user.uid), { email: document.getElementById('uEmail').value, role: document.getElementById('uRole').value, assignedSites: selectedSites });
                await signOut(authSecondary); e.target.reset(); loadUsers(); alert("User Created!");
            } catch(err) { alert(err.message); }
            btn.innerText = "Create & Grant Access";
        });

        window.deleteUserRecord = async (uid, email) => { if(confirm(`Revoke access for ${email}?`)) { await deleteDoc(doc(db, "users", uid)); loadUsers(); } };
        window.openEditModal = (uid, sitesStr) => {
            document.getElementById('editUserId').value = uid; const assignedSites = sitesStr ? sitesStr.split(',') : []; const cbDiv = document.getElementById('editSiteCheckboxes'); cbDiv.innerHTML = '';
            globalSites.forEach(s => { if(s.status === 'Ongoing') cbDiv.innerHTML += `<label class="flex items-center space-x-2 p-1 hover:bg-gray-200 cursor-pointer"><input type="checkbox" value="${s.name}" class="edit-site-cb w-4 h-4 text-blue-600" ${assignedSites.includes(s.name) ? 'checked' : ''}><span class="font-semibold">${s.name}</span></label>`; });
            document.getElementById('editUserModal').style.display = 'block';
        };
        window.closeEditModal = () => document.getElementById('editUserModal').style.display = 'none';
        window.saveUserSites = async () => { await updateDoc(doc(db, "users", document.getElementById('editUserId').value), { assignedSites: Array.from(document.querySelectorAll('.edit-site-cb:checked')).map(cb => cb.value) }); closeEditModal(); loadUsers(); alert("Sites Updated!"); };

        // -----------------------------------------------------
        // REPORTS & SUPER EXCEL EXPORT (EXCELJS)
        // -----------------------------------------------------
        let allReports = [];
        async function loadReports() {
            const q = query(collection(db, "daily_reports"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q); const tbody = document.getElementById('reportsTable'); tbody.innerHTML = '';
            snap.forEach((docSnap, index) => {
                const r = docSnap.data(); allReports[index] = r;
                tbody.innerHTML += `<tr class="border-b"><td class="p-3 border">${r.date}</td><td class="p-3 border font-bold">${r.siteId}</td><td class="p-3 border">${r.weather || '-'}</td><td class="p-3 border">${r.preparedBy || '-'}</td><td class="p-3 border"><button data-index="${index}" class="export-excel-btn bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700 font-bold"><i class="fa-solid fa-file-excel"></i> Export Pro</button></td></tr>`;
            });
        }

        // Professional Export Logic
        document.getElementById('reportsTable').addEventListener('click', async (e) => {
            if(e.target.closest('.export-excel-btn')) {
                const index = e.target.closest('.export-excel-btn').getAttribute('data-index');
                const r = allReports[index];
                
                const wb = new ExcelJS.Workbook();
                const ws = wb.addWorksheet('DPR Report');

                // Fonts & Colors
                const tFont = { name: 'Arial', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
                const hFont = { name: 'Arial', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
                const subFont = { name: 'Arial', size: 10, bold: true };
                const nFont = { name: 'Arial', size: 10 };
                
                const tFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4E78' } };
                const hFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F75B5' } };
                const secFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E1F2' } };
                const border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

                // 1. Header
                ws.mergeCells('A1:I2');
                ws.getCell('A1').value = "NIWASA CONSTRUCTIONS (PVT) LTD - DAILY PROGRESS REPORT";
                ws.getCell('A1').font = tFont; ws.getCell('A1').fill = tFill; ws.getCell('A1').alignment = {horizontal:'center', vertical:'middle'};

                // 2. Info
                ws.getCell('A4').value = "Date:"; ws.getCell('A4').font = subFont;
                ws.getCell('B4').value = r.date || '-'; ws.getCell('B4').font = nFont;
                
                ws.getCell('D4').value = "Project/Site:"; ws.getCell('D4').font = subFont;
                ws.getCell('E4').value = r.siteId || '-'; ws.getCell('E4').font = nFont;
                
                ws.getCell('G4').value = "Prepared By:"; ws.getCell('G4').font = subFont;
                ws.getCell('H4').value = r.preparedBy || '-'; ws.getCell('H4').font = nFont;

                let rowNum = 6;

                // Helper to draw tables
                const buildSection = (title, headers, dataArr, dataKeys) => {
                    ws.mergeCells(`A${rowNum}:I${rowNum}`);
                    ws.getCell(`A${rowNum}`).value = title; ws.getCell(`A${rowNum}`).font = subFont; ws.getCell(`A${rowNum}`).fill = secFill;
                    rowNum++;
                    
                    headers.forEach((h, i) => {
                        let c = ws.getCell(rowNum, i+1);
                        c.value = h; c.font = hFont; c.fill = hFill; c.border = border;
                    });
                    rowNum++;

                    if(dataArr && dataArr.length > 0) {
                        dataArr.forEach(item => {
                            dataKeys.forEach((k, i) => {
                                let c = ws.getCell(rowNum, i+1);
                                c.value = item[k] || '-'; c.font = nFont; c.border = border;
                            });
                            rowNum++;
                        });
                    } else {
                        ws.getCell(rowNum, 1).value = "No records added."; ws.getCell(rowNum, 1).font = nFont;
                        rowNum++;
                    }
                    rowNum++;
                };

                // Build Tables
                buildSection("1. WEATHER & DELAY TRACKING", ["From", "To", "Reason"], r.delays, ["from", "to", "reason"]);
                buildSection("2. EQUIPMENT TRANSFERS (IN / OUT)", ["Type", "Equipment", "From/To", "Notes"], r.transfers, ["type", "item", "site", "note"]);
                buildSection("3. MATERIALS RECEIVED (SUB-CONTRACT)", ["Material", "Qty", "Supplier", "Notes/Vehicle"], r.materials, ["name", "qty", "sup", "note"]);
                buildSection("4. LABOUR FORCE & ADVANCES", ["Name", "Category", "OT (Hrs)", "Advance (Rs)"], r.workers, ["name", "type", "ot", "adv"]);

                // Work Done Section
                ws.mergeCells(`A${rowNum}:I${rowNum}`);
                ws.getCell(`A${rowNum}`).value = "5. WORK DONE / ACTIVITY DESCRIPTION"; ws.getCell(`A${rowNum}`).font = subFont; ws.getCell(`A${rowNum}`).fill = secFill;
                rowNum++;
                ws.mergeCells(`A${rowNum}:I${rowNum+2}`);
                ws.getCell(`A${rowNum}`).value = r.workDone || '-'; ws.getCell(`A${rowNum}`).font = nFont; ws.getCell(`A${rowNum}`).alignment = {wrapText: true, vertical:'top'};
                
                // Set Column Widths
                ws.columns = [ {width:15}, {width:20}, {width:25}, {width:25}, {width:15}, {width:15}, {width:15}, {width:15}, {width:15} ];

                // Export File
                const buffer = await wb.xlsx.writeBuffer();
                saveAs(new Blob([buffer]), `DPR_${r.siteId}_${r.date}.xlsx`);
            }
        });

        loadSites(); loadReports();
    </script>
</body>
</html>
