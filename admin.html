<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Niwasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style> 
        .tab-content{display:none;} .tab-content.active{display:block;} 
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 900px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-2xl font-bold"><i class="fa-solid fa-shield mr-2"></i>Admin Area</h1>
        <div class="space-x-4">
            <button onclick="switchTab('reports')" class="font-bold">Approve Reports</button>
            <button onclick="logout()" class="bg-red-600 px-4 py-1 rounded">Logout</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
        <div id="tab-reports" class="tab-content active">
            <h2 class="text-2xl font-bold mb-4">Pending & Approved Reports</h2>
            <table class="w-full text-left border bg-white shadow">
                <thead class="bg-gray-200"><tr><th class="p-3 border">Date</th><th class="p-3 border">Site</th><th class="p-3 border">Status</th><th class="p-3 border text-center">Action</th></tr></thead>
                <!-- ID updated for Event Delegation -->
                <tbody id="tbReportsList"></tbody>
            </table>
        </div>
    </div>

    <input type="hidden" id="adminEmail">

    <!-- VIEW REPORT MODAL -->
    <div id="modalView" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center border-b pb-2 mb-4"><h2 class="text-2xl font-black text-blue-900">DPR DETAILS</h2><button onclick="document.getElementById('modalView').style.display='none'" class="text-red-600 font-bold text-2xl">&times;</button></div>
            <div class="flex justify-between mb-4 font-bold text-sm"><span id="mvDate"></span><span id="mvSite" class="text-blue-800"></span><span id="mvWeather" class="bg-gray-200 px-2 rounded"></span></div>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <div class="bg-orange-50 p-2 rounded border"><h4 class="font-bold">Delays</h4><table class="w-full text-sm bg-white"><tbody id="mvDelays"></tbody></table></div>
                <div class="bg-teal-50 p-2 rounded border"><h4 class="font-bold">Measurements</h4><table class="w-full text-sm bg-white"><tbody id="mvMeasures"></tbody></table></div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-green-50 p-2 rounded border"><h4 class="font-bold text-xs">Suppliers</h4><table class="w-full text-xs bg-white"><tbody id="mvSups"></tbody></table></div>
                    <div class="bg-lime-50 p-2 rounded border"><h4 class="font-bold text-xs">Sub-Contractors</h4><table class="w-full text-xs bg-white"><tbody id="mvSubs"></tbody></table></div>
                </div>
                <div class="bg-purple-50 p-2 rounded border"><h4 class="font-bold">Visitors & Notes</h4><table class="w-full text-sm bg-white"><tbody id="mvVisits"></tbody></table></div>
                <div class="bg-blue-50 p-2 rounded border"><h4 class="font-bold">Workers & Advances</h4><table class="w-full text-sm bg-white"><tbody id="mvWorkers"></tbody></table></div>
            </div>
            <div class="mt-4 pt-3 border-t text-right text-sm">
                <p class="font-bold text-gray-600">Prepared By: <span id="mvPreparedBy" class="text-blue-900"></span></p>
                <p class="font-bold text-green-700" id="mvApprovedBy"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM", authDomain: "niwasa-new-labour.firebaseapp.com", projectId: "niwasa-new-labour" }); 
        const auth = getAuth(app); const db = getFirestore(app);

        window.switchTab = (tab) => { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active'); };
        window.logout = () => signOut(auth).then(()=> window.location.href="index.html");

        auth.onAuthStateChanged(user => {
            if(!user) return window.location.href = "index.html";
            document.getElementById('adminEmail').value = user.email.split('@')[0];
        });

        let allReports = [];
        window.loadReports = async () => {
            const snap = await getDocs(query(collection(db, "daily_reports"), orderBy("timestamp", "desc")));
            const tb = document.getElementById('tbReportsList'); tb.innerHTML=''; allReports=[];
            
            snap.forEach((d, i) => {
                const r = d.data(); r.id = d.id; allReports.push(r);
                let badge = r.status==="Approved" ? `<span class="bg-green-100 text-green-800 px-2 rounded">Approved</span>` : `<span class="bg-yellow-100 text-yellow-800 px-2 rounded font-bold animate-pulse">Pending</span>`;
                
                // EVENT DELEGATION: Added data-act and data-idx instead of inline onclick
                let acts = `<button data-act="view" data-idx="${i}" class="bg-blue-500 text-white px-2 rounded hover:bg-blue-600 mr-1"><i class="fa-solid fa-eye"></i> View</button>`;
                acts += `<button data-act="excel" data-idx="${i}" class="bg-gray-600 text-white px-2 rounded mr-1">Excel</button>`;
                
                if(r.status !== "Approved") {
                    acts += `<button data-act="approve" data-id="${r.id}" class="bg-green-600 text-white px-2 rounded hover:bg-green-700 font-bold mr-1">Approve</button>`;
                }
                acts += `<button data-act="delete" data-id="${r.id}" class="bg-red-500 text-white px-2 rounded hover:bg-red-600">Del</button>`;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3 border">${r.date}</td><td class="p-3 border font-bold">${r.siteId}</td><td class="p-3 border">${badge}</td><td class="p-3 border text-center">${acts}</td>`;
                tb.appendChild(tr);
            });
        };

        // THE FIX: Event Delegation listener for all buttons in the table
        document.getElementById('tbReportsList').addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if(!btn) return;
            const act = btn.getAttribute('data-act');
            const idx = btn.getAttribute('data-idx');
            const id = btn.getAttribute('data-id');

            if(act === 'view') {
                const r = allReports[idx];
                document.getElementById('mvDate').innerText = "Date: " + r.date; 
                document.getElementById('mvSite').innerText = "Site: " + r.siteId; 
                document.getElementById('mvWeather').innerText = "Weather: " + (r.weather || 'N/A'); 
                document.getElementById('mvPreparedBy').innerText = r.preparedBy || 'Unknown';
                document.getElementById('mvApprovedBy').innerText = r.approvedBy ? `Approved By: ${r.approvedBy}` : '';

                const d = r.data || {};
                const renderMV = (arr, tid, keys) => {
                    const t = document.getElementById(tid); t.innerHTML='';
                    if(!arr || arr.length===0) { t.innerHTML='<tr><td class="p-1 text-gray-500 italic">No records.</td></tr>'; return; }
                    arr.forEach(item => { let tr = document.createElement('tr'); keys.forEach(k => { let td = document.createElement('td'); td.className="border p-1"; td.innerText=item[k]||'-'; tr.appendChild(td); }); t.appendChild(tr); });
                };
                renderMV(d.delays, 'mvDelays', ['f', 't', 'r']); renderMV(d.measures, 'mvMeasures', ['d', 'u']); renderMV(d.sups, 'mvSups', ['m', 'q', 'n']); renderMV(d.subs, 'mvSubs', ['t', 'q', 'n']); renderMV(d.visits, 'mvVisits', ['n', 'no', 't']); renderMV(d.workers, 'mvWorkers', ['n', 't', 'o', 'a']);
                document.getElementById('modalView').style.display='block';
            }
            
            if(act === 'excel') {
                try {
                    const r = allReports[idx]; 
                    const wb = new ExcelJS.Workbook(); 
                    const ws = wb.addWorksheet('DPR');
                    ws.getCell('A1').value = `DPR - ${r.siteId} (Status: ${r.status})`;
                    ws.getCell('A3').value = "Please download full detailed format code later in Phase 2.";
                    const buf = await wb.xlsx.writeBuffer(); 
                    window.saveAs(new Blob([buf]), `DPR_${r.siteId}.xlsx`);
                } catch(error) { alert("Excel Export Error: " + error.message); }
            }

            if(act === 'approve') {
                if(confirm("Approve this report? It will be visible to the customer.")) {
                    const aName = document.getElementById('adminEmail').value;
                    await updateDoc(doc(db, "daily_reports", id), { status: "Approved", approvedBy: aName });
                    window.loadReports();
                }
            }

            if(act === 'delete') {
                if(confirm("Are you sure you want to delete this report permanently?")) { 
                    await deleteDoc(doc(db, "daily_reports", id)); 
                    window.loadReports(); 
                }
            }
        });

        window.onload = () => window.loadReports();
    </script>
</body>
</html>
