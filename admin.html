<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Niwasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style> .tab-content{display:none;} .tab-content.active{display:block;} </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-2xl font-bold"><i class="fa-solid fa-shield mr-2"></i>Admin Area</h1>
        <div class="space-x-4">
            <button onclick="switchTab('reports')" class="font-bold">Approve Reports</button>
            <button onclick="logout()" class="bg-red-600 px-4 py-1 rounded">Logout</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
        <div id="tab-reports" class="tab-content active">
            <h2 class="text-2xl font-bold mb-4">Pending & Approved Reports</h2>
            <table class="w-full text-left border bg-white shadow">
                <thead class="bg-gray-200"><tr><th class="p-3 border">Date</th><th class="p-3 border">Site</th><th class="p-3 border">Status</th><th class="p-3 border text-center">Action</th></tr></thead>
                <tbody id="tbReports"></tbody>
            </table>
        </div>
    </div>

    <!-- Hidden element to hold admin email -->
    <input type="hidden" id="adminEmail">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM", authDomain: "niwasa-new-labour.firebaseapp.com", projectId: "niwasa-new-labour" }); 
        const auth = getAuth(app); const db = getFirestore(app);

        window.switchTab = (tab) => { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active'); };
        window.logout = () => signOut(auth).then(()=> window.location.href="index.html");

        auth.onAuthStateChanged(user => {
            if(!user) return window.location.href = "index.html";
            document.getElementById('adminEmail').value = user.email.split('@')[0]; // Get admin name
        });

        let allReports = [];
        window.loadReports = async () => {
            const snap = await getDocs(query(collection(db, "daily_reports"), orderBy("timestamp", "desc")));
            const tb = document.getElementById('tbReports'); tb.innerHTML=''; allReports=[];
            
            snap.forEach((d, i) => {
                const r = d.data(); r.id = d.id; allReports.push(r);
                let badge = r.status==="Approved" ? `<span class="bg-green-100 text-green-800 px-2 rounded">Approved</span>` : `<span class="bg-yellow-100 text-yellow-800 px-2 rounded font-bold animate-pulse">Pending</span>`;
                let acts = `<button onclick="exportRep(${i})" class="bg-blue-600 text-white px-2 rounded">Excel</button>`;
                
                // Show Approve button only if pending
                if(r.status !== "Approved") {
                    acts += `<button onclick="approveRep('${r.id}')" class="bg-green-600 text-white px-2 rounded ml-1">Approve</button>`;
                }
                acts += `<button onclick="delRep('${r.id}')" class="bg-red-500 text-white px-2 rounded ml-1">Del</button>`;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3 border">${r.date}</td><td class="p-3 border font-bold">${r.siteId}</td><td class="p-3 border">${badge}</td><td class="p-3 border text-center">${acts}</td>`;
                tb.appendChild(tr);
            });
        };

        window.approveRep = async (id) => {
            if(confirm("Approve this report? It will be visible to the customer.")) {
                const aName = document.getElementById('adminEmail').value;
                await updateDoc(doc(db, "daily_reports", id), { status: "Approved", approvedBy: aName });
                window.loadReports();
            }
        };

        window.delRep = async (id) => { if(confirm("Delete this?")) { await deleteDoc(doc(db, "daily_reports", id)); window.loadReports(); } };

        window.exportRep = async (i) => {
            const r = allReports[i]; const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('DPR');
            ws.getCell('A1').value = `DPR - ${r.siteId} (Status: ${r.status})`;
            // Basic Export for Phase 1. Will fully format in Phase 2.
            ws.getCell('A3').value = "Please download full detailed format code later.";
            const buf = await wb.xlsx.writeBuffer(); saveAs(new Blob([buf]), `DPR_${r.siteId}.xlsx`);
        };

        window.onload = () => window.loadReports();
    </script>
</body>
</html>
