<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niwasa Constructions - Login</title>
    <!-- CSS සඳහා Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Niwasa Constructions<br><span class="text-sm text-gray-500">DPR System Login</span></h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>
            <div>
                <label class="block text-gray-700">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">
                Login
            </button>
            <p id="errorMsg" class="text-red-500 text-sm text-center hidden">Email හෝ Password වැරදියි!</p>
        </form>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM",
            authDomain: "niwasa-new-labour.firebaseapp.com",
            projectId: "niwasa-new-labour",
            storageBucket: "niwasa-new-labour.firebasestorage.app",
            messagingSenderId: "963050302203",
            appId: "1:963050302203:web:b48870480bd31079f35e5e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const errorMsg = document.getElementById("errorMsg");

            loginBtn.innerText = "Logging in...";
            
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // සාර්ථකව ලොග් වුනා නම් තාවකාලිකව supervisor.html එකට යවමු
                    // පසුව මෙය Admin/Customer ලෙස වෙන් කරගත හැක
                    window.location.href = "supervisor.html";
                })
                .catch((error) => {
                    console.error(error);
                    errorMsg.classList.remove("hidden");
                    loginBtn.innerText = "Login";
                });
        });
    </script>
</body>
</html>
