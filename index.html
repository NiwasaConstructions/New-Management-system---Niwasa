<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niwasa Constructions - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen">

    <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md border-t-8 border-blue-900">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">NIWASA<br><span class="text-lg font-medium text-gray-500">Constructions (Pvt) Ltd</span></h2>
            <p class="text-sm text-blue-600 mt-2 font-semibold">System Portal Login</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 bg-gray-50" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 bg-gray-50" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-800 transition shadow-lg text-lg">
                Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
            </button>
            <p id="errorMsg" class="text-red-600 text-sm text-center font-bold hidden bg-red-100 p-2 rounded"></p>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM",
            authDomain: "niwasa-new-labour.firebaseapp.com",
            projectId: "niwasa-new-labour",
            storageBucket: "niwasa-new-labour.firebasestorage.app",
            messagingSenderId: "963050302203",
            appId: "1:963050302203:web:b48870480bd31079f35e5e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const errorMsg = document.getElementById("errorMsg");

            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            errorMsg.classList.add("hidden");
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Fetch User Role from Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const role = userDoc.data().role;
                    if (role === 'admin') window.location.href = "admin.html";
                    else if (role === 'supervisor') window.location.href = "supervisor.html";
                    else if (role === 'customer') window.location.href = "customer.html";
                    else throw new Error("Invalid user role assigned!");
                } else {
                    throw new Error("User record not found in database. Contact Admin.");
                }
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Access Denied: " + error.message;
                errorMsg.classList.remove("hidden");
                loginBtn.innerHTML = 'Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>';
            }
        });
    </script>
</body>
</html>
