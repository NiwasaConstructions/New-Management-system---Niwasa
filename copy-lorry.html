<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Lorry Cash 1-Click Copy</title>
    <!-- පරණ Firebase v8 එක පාවිච්චි කරන්නේ මේක කෙලින්ම Double-click කරලා වැඩ කරන්න ඕනේ නිසයි -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f4f8; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #ea580c; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #1e3a8a;">Lorry Cash Data Copy Tool</h2>
        <p>මේ බටන් එක එබුවම පරණ එකෙන් අලුත් එකට ඩේටා ටික කොපි වෙයි.</p>
        <button id="startBtn" onclick="startCopy()">දත්ත ටික කොපි කරන්න</button>
        <p id="status" style="margin-top: 20px; font-weight: bold; font-size: 18px;"></p>
    </div>

    <script>
        // 1. පරණ Database එක
        const oldConfig = {
            apiKey: "AIzaSyCGMzbzofR43a0RfrZxwt_M1--8INcxbxc",
            projectId: "erp---niwasa-payments"
        };
        const oldApp = firebase.initializeApp(oldConfig, "OldApp");
        const oldDb = oldApp.firestore();

        // 2. අලුත් Database එක
        const newConfig = {
            apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM",
            projectId: "niwasa-new-labour"
        };
        const newApp = firebase.initializeApp(newConfig, "NewApp");
        const newDb = newApp.firestore();

        async function startCopy() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.innerText = "කොපි වෙමින් පවතී... කරුණාකර රැඳී සිටින්න...";
            status.style.color = "blue";
            status.innerText = "පරණ Database එකට සම්බන්ධ වෙමින්...";

            try {
                // පරණ එකෙන් lorry_cash කියන එක ගන්නවා
                const snapshot = await oldDb.collection("lorry_cash").get();
                let count = 0;

                for (let doc of snapshot.docs) {
                    let data = doc.data();
                    
                    let amountVal = parseFloat(data.amount || 0);
                    let recordType = data.type;
                    if(!recordType) { recordType = amountVal < 0 ? 'EXPENSE' : 'ADVANCE'; }

                    let payload = {
                        type: recordType,
                        date: data.date || new Date().toISOString().split('T')[0],
                        desc: data.desc || data.description || 'Old Record',
                        amount: Math.abs(amountVal),
                        timestamp: data.timestamp || firebase.firestore.FieldValue.serverTimestamp()
                    };

                    // අලුත් එකේ pay_lorry කියන එකට ලියනවා
                    await newDb.collection("pay_lorry").add(payload);
                    count++;
                }

                status.style.color = "green";
                status.innerText = `සාර්ථකයි! පරණ රෙකෝඩ්ස් ${count} ක් අලුත් සිස්ටම් එකට කොපි වුණා.`;
            } catch (error) {
                status.style.color = "red";
                status.innerText = "අවුලක් ආවා: " + error.message;
            }
        }
    </script>
</body>
</html>
