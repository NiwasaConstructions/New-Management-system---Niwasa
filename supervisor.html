<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 800px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-close { float: right; font-size: 28px; font-weight: bold; color: #dc2626; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md mb-10 border-t-4 border-blue-600">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800">Daily Progress Report (DPR)</h1>
                <p class="text-blue-600 font-bold" id="supervisorInfo">Loading your details...</p>
            </div>
            <div class="space-x-2">
                <button onclick="switchTab('entry')" class="bg-blue-600 text-white px-4 py-2 rounded shadow font-bold"><i class="fa-solid fa-pen"></i> Submit Data</button>
                <button onclick="switchTab('history')" class="bg-gray-800 text-white px-4 py-2 rounded shadow font-bold"><i class="fa-solid fa-clock-rotate-left"></i> My History</button>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded shadow hover:bg-red-600 font-bold"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>
        
        <!-- ENTRY TAB (Keep your full supervisor form here) -->
        <div id="entryTab" class="block">
            <h2 class="text-xl font-bold mb-4">Enter Data for Today</h2>
            <!-- Include dprForm here -->
        </div>

        <!-- HISTORY TAB -->
        <div id="historyTab" class="hidden">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">My Submitted Reports</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border bg-white">
                    <thead class="bg-gray-200"><tr><th class="p-3 border">Date</th><th class="p-3 border">Site</th><th class="p-3 border text-center">Action</th></tr></thead>
                    <tbody id="supReportsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- VIEW REPORT MODAL -->
    <div id="viewReportModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeViewModal()">&times;</span>
            <div class="border-b-2 border-blue-800 pb-3 mb-4"><h2 class="text-2xl font-black text-blue-900">DPR DETAILS</h2></div>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2" id="vContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const config = { apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM", authDomain: "niwasa-new-labour.firebaseapp.com", projectId: "niwasa-new-labour", storageBucket: "niwasa-new-labour.firebasestorage.app", messagingSenderId: "963050302203", appId: "1:963050302203:web:b48870480bd31079f35e5e" };
        const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);

        window.logout = () => signOut(auth).then(()=> window.location.href="index.html");
        window.switchTab = (tab) => {
            document.getElementById('entryTab').style.display = tab==='entry' ? 'block' : 'none';
            document.getElementById('historyTab').style.display = tab==='history' ? 'block' : 'none';
            if(tab==='history') loadMyHistory();
        };

        let mySites = [];
        let myReports = [];
        
        auth.onAuthStateChanged(async user => {
            if(!user) return window.location.href = "index.html";
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if(userDoc.exists()) { mySites = userDoc.data().assignedSites || []; }
        });

        // Load Supervisor's History (Only their assigned sites)
        async function loadMyHistory() {
            if(mySites.length === 0) return;
            const q = query(collection(db, "daily_reports"), where("siteId", "in", mySites));
            const snap = await getDocs(q); const tbody = document.getElementById('supReportsTable'); tbody.innerHTML = '';
            
            myReports = []; snap.forEach(d => myReports.push(d.data()));
            myReports.sort((a,b) => (b.timestamp?.toMillis()||0) - (a.timestamp?.toMillis()||0));

            myReports.forEach((r, index) => {
                tbody.innerHTML += `<tr class="border-b">
                    <td class="p-3 border font-semibold">${r.date}</td><td class="p-3 border font-bold">${r.siteId}</td>
                    <td class="p-3 border text-center"><button onclick="viewReport(${index})" class="bg-blue-500 text-white px-3 py-1 rounded shadow"><i class="fa-solid fa-eye"></i> View</button></td>
                </tr>`;
            });
        }

        window.viewReport = (index) => {
            const r = myReports[index];
            document.getElementById('vContent').innerHTML = `
                <p><strong>Date:</strong> ${r.date} | <strong>Site:</strong> ${r.siteId}</p>
                <p><strong>Work Done:</strong> ${r.workDone}</p>
                <hr>
                <h4 class="font-bold">Workers (${r.workers?.length || 0})</h4>
                <p class="text-sm">${r.workers?.map(w => w.name + " (" + w.type + ") - Rs." + w.adv).join('<br>') || 'None'}</p>
            `;
            document.getElementById('viewReportModal').style.display = 'block';
        };
        window.closeViewModal = () => document.getElementById('viewReportModal').style.display = 'none';
    </script>
</body>
</html>
