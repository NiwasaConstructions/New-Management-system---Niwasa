<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md mb-10 border-t-4 border-blue-600">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Daily Progress Report (DPR)</h1>
                <p class="text-gray-500 font-semibold" id="supervisorInfo">Loading your details...</p>
            </div>
            <button id="btnLogout" class="bg-red-500 text-white px-4 py-2 rounded shadow hover:bg-red-600">Logout</button>
        </div>
        
        <form id="dprForm" class="space-y-6">
            <div class="bg-gray-50 p-4 rounded border">
                <h3 class="font-bold text-gray-700 mb-3 border-b pb-1">1. General Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div><label class="block text-sm font-semibold">Date</label><input type="date" id="date" class="w-full border p-2 rounded" required></div>
                    <div><label class="block text-sm font-semibold">DOC No / Time</label><input type="text" id="docNo" class="w-full border p-2 rounded"></div>
                    <div>
                        <label class="block text-sm font-bold text-blue-800">Select Project / Site</label>
                        <select id="siteId" class="w-full border p-2 rounded bg-yellow-100 border-yellow-400 font-bold" required><option value="">Fetching sites...</option></select>
                    </div>
                    <div><label class="block text-sm font-semibold">Weather</label><select id="weather" class="w-full border p-2 rounded"><option>Sunny</option><option>Cloudy</option><option>Light Shower</option><option>Heavy Rain</option></select></div>
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded border border-blue-200">
                <h3 class="font-bold text-gray-700 mb-3 border-b border-blue-300 pb-1">2. Workers & Labours</h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-2">
                    <input type="text" id="wName" placeholder="Name" class="border p-2 rounded col-span-2 md:col-span-1">
                    <select id="wType" class="border p-2 rounded"><option>SK</option><option>USK</option></select>
                    <input type="text" id="wOT" placeholder="OT (Hrs)" class="border p-2 rounded">
                    <input type="number" id="wAdv" placeholder="Advance (Rs)" class="border p-2 rounded">
                    <button type="button" id="btnAddWorker" class="bg-blue-600 text-white font-bold rounded p-2 hover:bg-blue-700">Add Worker</button>
                </div>
                <table class="w-full text-sm text-left bg-white border"><tbody id="workersTable"></tbody></table>
            </div>

            <div class="bg-gray-50 p-4 rounded border">
                <h3 class="font-bold text-gray-700 mb-3 border-b pb-1">3. Work Done & Notes</h3>
                <textarea id="workDesc" rows="3" class="w-full border p-2 rounded" placeholder="Description of work completed..." required></textarea>
                <div class="mt-2"><input type="text" id="preparedBy" placeholder="Prepared By (Your Name)" class="w-full border p-2 rounded" required></div>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-900 text-white font-bold py-4 rounded-lg shadow-lg text-lg">Submit Final DPR</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        
        const config = { apiKey: "AIzaSyBYG7fHMIe0VHyTQnQKro49fFk95jtjcTM", authDomain: "niwasa-new-labour.firebaseapp.com", projectId: "niwasa-new-labour", storageBucket: "niwasa-new-labour.firebasestorage.app", messagingSenderId: "963050302203", appId: "1:963050302203:web:b48870480bd31079f35e5e" };
        const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth).then(()=> window.location.href="index.html"));

        auth.onAuthStateChanged(async user => {
            if(!user) return window.location.href = "index.html";
            document.getElementById('supervisorInfo').innerText = "Logged in as: " + user.email;
            
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const drop = document.getElementById('siteId');
                if (userDoc.exists()) {
                    const assignedSites = userDoc.data().assignedSites || [];
                    drop.innerHTML = '<option value="">-- Select Your Site --</option>';
                    assignedSites.forEach(siteName => drop.innerHTML += `<option value="${siteName}">${siteName}</option>`);
                    if(assignedSites.length === 0) drop.innerHTML = '<option value="">No sites assigned!</option>';
                }
            } catch(e) { alert("Error fetching sites: " + e.message); }
        });

        let workers = [];
        document.getElementById('btnAddWorker').addEventListener('click', () => {
            const n = document.getElementById('wName').value; if(!n) return;
            workers.push({ name: n, type: document.getElementById('wType').value, ot: document.getElementById('wOT').value || "-", adv: document.getElementById('wAdv').value || "0" });
            const tbody = document.getElementById('workersTable'); tbody.innerHTML = '';
            workers.forEach(w => tbody.innerHTML += `<tr class="border-b"><td class="p-2 border">${w.name}</td><td class="p-2 border">${w.type}</td><td class="p-2 border">OT: ${w.ot}</td><td class="p-2 border text-red-600">Rs.${w.adv}</td></tr>`);
            document.getElementById('wName').value = ''; document.getElementById('wAdv').value = '';
        });

        document.getElementById('dprForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            document.getElementById('submitBtn').innerText = "Submitting...";
            try {
                await addDoc(collection(db, "daily_reports"), {
                    date: document.getElementById('date').value, docNo: document.getElementById('docNo').value, siteId: document.getElementById('siteId').value,
                    weather: { condition: document.getElementById('weather').value },
                    workers: workers,
                    workDone: { desc: document.getElementById('workDesc').value },
                    remarks: { preparedBy: document.getElementById('preparedBy').value },
                    timestamp: new Date()
                });
                alert("Report Submitted Successfully!"); window.location.reload();
            } catch(e) {
                alert("Submit Error: " + e.message);
                document.getElementById('submitBtn').innerText = "Submit Final DPR";
            }
        });
    </script>
</body>
</html>
